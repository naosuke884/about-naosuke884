name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Biome (lint + format)
        run: npx biome ci .

      - name: Astro check
        run: npx astro check

      # checkでは検出できないビルド時エラー(OG画像生成の外部フェッチ等)をPR時点で検出する
      - name: Build
        run: npm run build
