version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 出たばかりの不具合版や乗っ取られた版を避けるため、リリースから7日経った版だけを提案させる
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # 1件ずつPRにするとpackage-lock.jsonが衝突し、同時に開けるPR数の上限(5件)ですぐ詰まるため、メジャー以外はまとめる
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      # 脆弱性修正のPRは上のグループの対象外で1件ずつ届くため、別にまとめる
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Playwrightコンテナ(ws://playwright:3000)とバージョンが一致しないと接続できないため、コンテナ側と合わせて手で上げる
      - dependency-name: playwright-core
      # 実行環境(CI・engines)のNode 22に型を揃え、存在しないAPIを型検査で通さないため
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
