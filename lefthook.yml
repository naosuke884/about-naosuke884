pre-commit:
  # 日付を書き込んでから検査する(astro checkが書き込み後のfrontmatterを読むように)
  piped: true
  jobs:
    - name: blog dates
      glob: "src/blog/content/*.md"
      run: node scripts/stamp-blog-dates.ts
      stage_fixed: true

    - group:
        parallel: true
        jobs:
          - name: biome check
            run: npx biome check --fix .
            stage_fixed: true

          - name: astro check
            run: npx astro check

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
